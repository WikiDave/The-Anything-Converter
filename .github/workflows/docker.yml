# Docker image: built on every push (test), published to ghcr.io on a release tag or by hand.
#   docker run -p 8000:8000 ghcr.io/wikidave/the-anything-converter
#   docker run -it --rm -v "$PWD:/data" ghcr.io/wikidave/the-anything-converter anything-converter-tui
name: Docker

on:
  push:
    branches: [main, claude/anything-converter]
    tags: ["v*"]
    paths-ignore: ["docs/**", "**.md", "Formula/**", "bucket/**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: anything-converter:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test web and terminal inside the container
        run: |
          docker run -d --name ac -p 8000:8000 anything-converter:test
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/ping && break; sleep 1; done
          curl -sf http://127.0.0.1:8000/api/ping | grep -q anything-converter
          docker run --rm anything-converter:test anything-converter-tui --version
          mkdir -p data && chmod 777 data
          docker run --rm -v "$PWD/data:/data" -w /data anything-converter:test \
            python -c "from PIL import Image; Image.new('RGB', (64, 48), 'red').save('a.png')"
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/data:/data" -w /data anything-converter:test \
            anything-converter-tui convert a.png --to webp
          test -s data/a.webp
          docker run --rm -t anything-converter:test sh -c 'echo 9 | anything-converter-tui --simple' | grep -q "WHAT DO YOU WANT TO DO"
      - name: Log in to ghcr.io
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/wikidave/the-anything-converter:latest
            ghcr.io/wikidave/the-anything-converter:${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'manual' }}
          cache-from: type=gha

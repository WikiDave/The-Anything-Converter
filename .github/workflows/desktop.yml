name: Desktop-installers

# Bouwt de desktop-app voor Windows (.msi), macOS (.dmg, Apple Silicon + Intel) en Linux
# (.deb + .AppImage), met ffmpeg, ffprobe, yt-dlp en Deno erin. De app opent in een eigen
# programmavenster (pywebview); de rooktest controleert dat ook.
# - Push naar een branch: alleen bouwen en testen.
# - Handmatig starten (Actions -> Run workflow) of een tag v*: ook publiceren als GitHub-release.
on:
  push:
    branches: [main, claude/anything-converter]
    tags: ["v*"]
    paths:
      - "desktop/**"
      - "converter/**"
      - "static/**"
      - "app.py"
      - "tui.py"
      - "requirements.txt"
      - "android/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Versie (bijv. 2.1.0)"
        required: true
        default: "2.7.0"

permissions:
  contents: read

# Een nieuwe push op dezelfde branch stopt een oudere bouw die nog loopt.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            platform: win-x64
          - name: macOS (Apple Silicon)
            os: macos-15
            platform: mac-arm64
          - name: macOS (Intel)
            os: macos-15-intel
            platform: mac-x64
          - name: Linux
            os: ubuntu-22.04
            platform: linux-x64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Versienummer
        if: inputs.version
        run: echo "${{ inputs.version }}" > VERSION

      - name: Python-pakketten
        run: |
          python -m pip install --upgrade pip
          # pikepdf heeft geen kant-en-klaar pakket voor Intel-Macs; het is alleen een reserve
          # voor PDF-compressie, dus daar laten we het weg.
          if [ "${{ matrix.platform }}" = mac-x64 ]; then grep -v '^pikepdf' requirements.txt > req.txt
          else cp requirements.txt req.txt; fi
          pip install -r req.txt "cx_Freeze==8.7.2"

      - name: ffmpeg, ffprobe en Deno ophalen
        run: bash desktop/fetch_bins.sh ${{ matrix.platform }}

      - name: Bouwen (Windows .msi)
        if: matrix.platform == 'win-x64'
        run: |
          python desktop/setup_freeze.py build_exe bdist_msi
          mkdir -p out
          cp dist/*.msi out/AnythingConverter-Windows.msi
          echo "EXE=$(ls -d build/exe.*)/AnythingConverter.exe" >> "$GITHUB_ENV"

      - name: Bouwen (macOS .dmg)
        if: startsWith(matrix.platform, 'mac')
        run: |
          python desktop/setup_freeze.py bdist_dmg
          mkdir -p out
          NAME=$([ "${{ matrix.platform }}" = mac-arm64 ] && echo AppleSilicon || echo Intel)
          cp "$(find build dist -name '*.dmg' 2>/dev/null | head -1)" "out/AnythingConverter-macOS-$NAME.dmg"
          echo "EXE=$(find build -path '*.app/Contents/MacOS/AnythingConverter' | head -1)" >> "$GITHUB_ENV"

      - name: Bouwen (Linux .deb + .AppImage)
        if: matrix.platform == 'linux-x64'
        run: |
          python desktop/setup_freeze.py build_exe
          BUILD=$(ls -d build/exe.*)
          mkdir -p out
          bash desktop/make_deb.sh "$BUILD" "$(cat VERSION)" out/AnythingConverter-Linux.deb
          bash desktop/make_appimage.sh "$BUILD" out/AnythingConverter-Linux.AppImage
          echo "EXE=$BUILD/AnythingConverter" >> "$GITHUB_ENV"

      - name: Terminalversie inpakken voor Homebrew (macOS, Linux)
        if: matrix.platform != 'win-x64'
        run: |
          if [ "${{ matrix.platform }}" = linux-x64 ]; then
            DIR="$(dirname "$EXE")"
          else
            DIR="$(cd "$(dirname "$EXE")/../.." && pwd)"   # de .app-map
          fi
          NAME=$(echo "${{ matrix.platform }}" | sed 's/^mac-/macos-/')
          tar -czf "out/anything-converter-tui-$NAME.tar.gz" -C "$(dirname "$DIR")" "$(basename "$DIR")"
          ls -la out

      - name: GTK/WebKit voor het programmavenster (Linux)
        if: matrix.platform == 'linux-x64'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q python3-gi gir1.2-gtk-3.0 gir1.2-webkit2-4.1 xvfb

      - name: Rooktest (starten in eigen venster, converteren, afsluiten)
        env:
          EXPECT_WINDOW: native
          ALLOW_NO_SPEECH: ${{ matrix.platform == 'mac-x64' && '1' || '0' }}
        run: |
          if [ "${{ matrix.platform }}" = linux-x64 ]; then
            xvfb-run -a python desktop/smoke_test.py "$EXE"
          else
            python desktop/smoke_test.py "$EXE"
          fi

      - name: Rooktest terminalversie
        run: |
          TUI="$(dirname "$EXE")/anything-converter-tui"
          [ -f "$TUI.exe" ] && TUI="$TUI.exe"
          OUT="$("$TUI" --version)"
          echo "$OUT"
          echo "$OUT" | grep -q "terminal"

      - name: Logbestand bij fouten
        if: failure()
        run: |
          cat "$LOCALAPPDATA/AnythingConverter/anything-converter.log" 2>/dev/null || true
          cat ~/Library/Logs/AnythingConverter/anything-converter.log 2>/dev/null || true
          cat ~/.local/state/AnythingConverter/anything-converter.log 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}
          path: out/*
          if-no-files-found: error

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Ondertekeningssleutel (optioneel, uit GitHub-geheimen)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "vaste sleutel gebruikt"
          else
            echo "::notice::Geen ANDROID_KEYSTORE_B64-geheim: APK wordt met een debug-sleutel ondertekend."
          fi
      - name: APK bouwen
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION="${{ inputs.version }}"
          [ -n "$VERSION" ] || VERSION="$(cat VERSION)"
          CODE=$(echo "$VERSION" | awk -F. '{ printf "%d", $1*10000 + $2*100 + $3 }')
          gradle -p android assembleRelease -PversionName="$VERSION" -PversionCode="$CODE" --no-daemon
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/AnythingConverter-Android.apk
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: installer-android
          path: out/*
          if-no-files-found: error

  release:
    name: Publiceren
    needs: [build, android]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Release-tekst
        run: |
          cat > notes.md <<'EOF'
          ## Installeren

          | Systeem | Bestand |
          |---|---|
          | Windows 10/11 | `AnythingConverter-Windows.msi` |
          | Mac met M1/M2/M3/M4 | `AnythingConverter-macOS-AppleSilicon.dmg` |
          | Mac met Intel | `AnythingConverter-macOS-Intel.dmg` |
          | Ubuntu / Debian / Mint | `AnythingConverter-Linux.deb` |
          | Andere Linux | `AnythingConverter-Linux.AppImage` |
          | Android 10+ | `AnythingConverter-Android.apk` |
          | iPhone / iPad | geen bestand: open de web-app in Safari → Deel → Zet op beginscherm |
          | Terminal (macOS/Linux) | `brew tap wikidave/anything-converter https://github.com/WikiDave/The-Anything-Converter` `brew trust wikidave/anything-converter` en `brew install anything-converter` |

          ffmpeg, yt-dlp en Deno zitten erin. De converter opent in een eigen programmavenster;
          venster dicht = programma af. Met **[ TERMINAL ]** bovenin open je de terminalversie.

          **Eerste keer openen** (de app is niet betaald ondertekend):
          - **Windows**: "Windows heeft uw pc beschermd" → **Meer informatie** → **Toch uitvoeren**.
          - **macOS** ("Apple kon niet verifiëren…"): klik **Gereed**, ga naar **Systeeminstellingen → Privacy en beveiliging** en klik onderaan **Toch openen**. Of in Terminal: `xattr -dr com.apple.quarantine "/Applications/Anything Converter.app"`
          - **Linux AppImage**: rechtsklik → Eigenschappen → "Uitvoeren als programma" aanzetten.
          - **Android**: open het .apk-bestand en sta "Installeren van onbekende apps" toe voor je browser.
          EOF
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', inputs.version) }}
          name: Anything Converter ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', inputs.version) }}
          body_path: notes.md
          files: out/*
          make_latest: true

      # Homebrew-formule bijwerken met de nieuwe versie en sha256-waarden. brew tap leest de
      # standaardbranch van de repo; die kan anders zijn dan main, dus beide bijwerken.
      - name: Homebrew-formule bijwerken
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          V="${{ inputs.version }}"
          [ -n "$V" ] || V="${GITHUB_REF_NAME#v}"
          OUT="$PWD/out"
          for B in main $DEFAULT_BRANCH; do
            [ -d "repo-$B" ] && continue
            git clone -q --depth 1 --branch "$B" "$REPO_URL" "repo-$B"
            cd "repo-$B"
            if [ -f desktop/update_formula.py ] && [ -f Formula/anything-converter.rb ]; then
              python3 desktop/update_formula.py "$V" "$OUT" > /dev/null
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add Formula/anything-converter.rb
              git diff --cached --quiet || { git commit -q -m "Homebrew: anything-converter $V"; git push -q origin "HEAD:$B"; }
              echo "formule bijgewerkt op $B"
            fi
            cd ..
          done

  homebrew:
    name: Homebrew-test (${{ matrix.os }})
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-22.04]
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - name: Installeren via brew en starten
        run: |
          if [ -x /home/linuxbrew/.linuxbrew/bin/brew ]; then eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"; fi
          brew tap wikidave/anything-converter https://github.com/WikiDave/The-Anything-Converter
          # Nieuwere Homebrew laadt formules uit taps van buiten pas na 'brew trust'
          if brew commands | grep -qx trust; then brew trust wikidave/anything-converter; fi
          brew install wikidave/anything-converter/anything-converter
          anything-converter-tui --version
          brew test anything-converter

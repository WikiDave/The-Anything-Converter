name: Desktop-installers

# Bouwt de desktop-app voor Windows (.msi), macOS (.dmg, Apple Silicon + Intel) en Linux
# (.deb + .AppImage), met ffmpeg, ffprobe, yt-dlp en Deno erin.
# - Push naar een branch: alleen bouwen en testen.
# - Handmatig starten (Actions -> Run workflow) of een tag v*: ook publiceren als GitHub-release.
on:
  push:
    branches: [main, claude/anything-converter]
    tags: ["v*"]
    paths:
      - "desktop/**"
      - "converter/**"
      - "static/**"
      - "app.py"
      - "requirements.txt"
      - "android/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Versie (bijv. 2.1.0)"
        required: true
        default: "2.1.0"

permissions:
  contents: read

# Een nieuwe push op dezelfde branch stopt een oudere bouw die nog loopt.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            platform: win-x64
          - name: macOS (Apple Silicon)
            os: macos-15
            platform: mac-arm64
          - name: macOS (Intel)
            os: macos-15-intel
            platform: mac-x64
          - name: Linux
            os: ubuntu-22.04
            platform: linux-x64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python-pakketten
        run: |
          python -m pip install --upgrade pip
          # pikepdf heeft geen kant-en-klaar pakket voor Intel-Macs; het is alleen een reserve
          # voor PDF-compressie, dus daar laten we het weg.
          if [ "${{ matrix.platform }}" = mac-x64 ]; then grep -v '^pikepdf' requirements.txt > req.txt
          else cp requirements.txt req.txt; fi
          pip install -r req.txt "cx_Freeze==8.7.2"

      - name: ffmpeg, ffprobe en Deno ophalen
        run: bash desktop/fetch_bins.sh ${{ matrix.platform }}

      - name: Bouwen (Windows .msi)
        if: matrix.platform == 'win-x64'
        run: |
          python desktop/setup_freeze.py build_exe bdist_msi
          mkdir -p out
          cp dist/*.msi out/AnythingConverter-Windows.msi
          echo "EXE=$(ls -d build/exe.*)/AnythingConverter.exe" >> "$GITHUB_ENV"

      - name: Bouwen (macOS .dmg)
        if: startsWith(matrix.platform, 'mac')
        run: |
          python desktop/setup_freeze.py bdist_dmg
          mkdir -p out
          NAME=$([ "${{ matrix.platform }}" = mac-arm64 ] && echo AppleSilicon || echo Intel)
          cp "$(find build dist -name '*.dmg' 2>/dev/null | head -1)" "out/AnythingConverter-macOS-$NAME.dmg"
          echo "EXE=$(find build -path '*.app/Contents/MacOS/AnythingConverter' | head -1)" >> "$GITHUB_ENV"

      - name: Bouwen (Linux .deb + .AppImage)
        if: matrix.platform == 'linux-x64'
        run: |
          python desktop/setup_freeze.py build_exe
          BUILD=$(ls -d build/exe.*)
          mkdir -p out
          bash desktop/make_deb.sh "$BUILD" "${{ inputs.version || '2.1.0' }}" out/AnythingConverter-Linux.deb
          bash desktop/make_appimage.sh "$BUILD" out/AnythingConverter-Linux.AppImage
          echo "EXE=$BUILD/AnythingConverter" >> "$GITHUB_ENV"

      - name: Rooktest (starten, converteren, afsluiten)
        run: python desktop/smoke_test.py "$EXE"

      - name: Logbestand bij fouten
        if: failure()
        run: |
          cat "$LOCALAPPDATA/AnythingConverter/anything-converter.log" 2>/dev/null || true
          cat ~/Library/Logs/AnythingConverter/anything-converter.log 2>/dev/null || true
          cat ~/.local/state/AnythingConverter/anything-converter.log 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}
          path: out/*
          if-no-files-found: error

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Ondertekeningssleutel (optioneel, uit GitHub-geheimen)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "vaste sleutel gebruikt"
          else
            echo "::notice::Geen ANDROID_KEYSTORE_B64-geheim: APK wordt met een debug-sleutel ondertekend."
          fi
      - name: APK bouwen
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION="${{ inputs.version || '2.1.0' }}"
          CODE=$(echo "$VERSION" | awk -F. '{ printf "%d", $1*10000 + $2*100 + $3 }')
          gradle -p android assembleRelease -PversionName="$VERSION" -PversionCode="$CODE" --no-daemon
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/AnythingConverter-Android.apk
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: installer-android
          path: out/*
          if-no-files-found: error

  release:
    name: Publiceren
    needs: [build, android]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Release-tekst
        run: |
          cat > notes.md <<'EOF'
          ## Installeren

          | Systeem | Bestand |
          |---|---|
          | Windows 10/11 | `AnythingConverter-Windows.msi` |
          | Mac met M1/M2/M3/M4 | `AnythingConverter-macOS-AppleSilicon.dmg` |
          | Mac met Intel | `AnythingConverter-macOS-Intel.dmg` |
          | Ubuntu / Debian / Mint | `AnythingConverter-Linux.deb` |
          | Andere Linux | `AnythingConverter-Linux.AppImage` |
          | Android 10+ | `AnythingConverter-Android.apk` |
          | iPhone / iPad | geen bestand: open de web-app in Safari → Deel → Zet op beginscherm |

          ffmpeg, yt-dlp en Deno zitten erin. Na het starten opent de converter in je browser;
          afsluiten met **[ AFSLUITEN ]** bovenaan de pagina.

          **Eerste keer openen** (de app is niet betaald ondertekend):
          - **Windows**: "Windows heeft uw pc beschermd" → **Meer informatie** → **Toch uitvoeren**.
          - **macOS**: dubbelklik, sluit de melding, ga naar **Systeeminstellingen → Privacy en beveiliging** en klik onderaan **Toch openen**.
          - **Linux AppImage**: rechtsklik → Eigenschappen → "Uitvoeren als programma" aanzetten.
          - **Android**: open het .apk-bestand en sta "Installeren van onbekende apps" toe voor je browser.
          EOF
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', inputs.version) }}
          name: Anything Converter ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', inputs.version) }}
          body_path: notes.md
          files: out/*
          make_latest: true
